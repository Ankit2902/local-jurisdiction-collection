    .resident-agent-trigger {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 80px;
      height: 80px;
      border-radius: 13px;
      border: none;
      padding: 8px;
      cursor: pointer;
      z-index: 9998;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      background: transparent;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, border 0.2s ease;
      overflow: hidden;
    }

    .resident-agent-trigger,
    .resident-agent-callout {
      --resident-agent-glass-border: 1px solid rgba(255, 255, 255, 0.3);
      --resident-agent-callout-border: 1px solid rgba(255, 255, 255, 0.4);
    }

    @supports (backdrop-filter: blur(10px)) or (-webkit-backdrop-filter: blur(10px)) {
      .resident-agent-trigger {
        background: color-mix(in srgb, var(--trigger-color, #CC0020) 30%, rgba(255, 255, 255, 0.7));
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      }
      
      .resident-agent-trigger:hover {
        background: color-mix(in srgb, var(--trigger-color, #CC0020) 40%, rgba(255, 255, 255, 0.7));
        border-color: rgba(255, 255, 255, 0.4);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
      }
      
      .resident-agent-trigger.open {
        background: var(--trigger-color, #CC0020);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        border-color: transparent;
      }

      .resident-agent-callout {
        background: color-mix(in srgb, var(--trigger-color, #CC0020) 30%, rgba(255, 255, 255, 0.7));
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: var(--resident-agent-callout-border);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      }
    }

    @supports not ((backdrop-filter: blur(10px)) or (-webkit-backdrop-filter: blur(10px))) {
      .resident-agent-trigger {
        background: color-mix(in srgb, var(--trigger-color, #CC0020) 30%, white);
        border: 1px solid rgba(0, 0, 0, 0.1);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      }
      
      .resident-agent-trigger:hover {
        background: color-mix(in srgb, var(--trigger-color, #CC0020) 40%, white);
        border-color: rgba(0, 0, 0, 0.15);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
      }
      
      .resident-agent-trigger.open {
        background: var(--trigger-color, #CC0020);
        border-color: transparent;
      }

      .resident-agent-callout {
        background: color-mix(in srgb, var(--trigger-color, #CC0020) 30%, white);
        border: 1px solid rgba(0, 0, 0, 0.1);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      }
    }

    .resident-agent-trigger-icon-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .resident-agent-trigger-icon {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 0;
      opacity: 1;
    }

    .resident-agent-trigger:hover {
      transform: scale(1.05);
    }

    .resident-agent-trigger:focus {
      outline: 2px solid var(--trigger-color, #CC0020);
      outline-offset: 2px;
    }

    .resident-agent-trigger:active {
      transform: scale(0.95);
    }

    .resident-agent-callout {
      position: fixed;
      bottom: calc(20px + 80px + 0px + 4px);
      right: 20px;
      box-sizing: border-box;
      max-width: min(208px, calc(100vw - 40px));
      padding: 12px 4px 12px 14px;
      border: var(--resident-agent-callout-border);
      border-radius: 12px;
      background: color-mix(in srgb, var(--trigger-color, #CC0020) 30%, rgba(255, 255, 255, 0.7));
      box-shadow: 0 8px 28px rgba(15, 23, 42, 0.18);
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      line-height: 1.35;
      z-index: 9997;
      display: flex;
      align-items: center;
      overflow-wrap: anywhere;
    }

    .resident-agent-callout-text {
      position: relative;
      z-index: 1;
    }

    .resident-agent-callout-text p {
      margin: 0 0 0.6em;
      white-space: pre-wrap;
    }

    .resident-agent-callout-text p:last-child {
      margin-bottom: 0;
    }

    .resident-agent-callout-text a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .resident-agent-callout-text a:hover,
    .resident-agent-callout-text a:visited {
      color: inherit;
    }

    .resident-agent-callout-text a:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 2px;
      border-radius: 2px;
    }

    .resident-agent-callout.hidden {
      display: none;
    }

    .resident-agent-callout-close {
      position: absolute;
      top: -12px;
      right: -12px;
      width: 24px;
      height: 24px;
      border: solid 1px #374151;
      border-radius: 4px;
      background: #ffffff;
      color: #374151;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 20px;
      font-weight: 400;
      line-height: 1;
      padding: 0;
      transition: background-color 0.2s ease;
      z-index: 2;
    }

    .resident-agent-callout-close:hover {
      background: rgba(255, 255, 255, 0.9);
      color: #374151;
    }

    .resident-agent-callout-close:focus {
      outline: 2px solid var(--trigger-color, #CC0020);
      outline-offset: 1px;
    }

    .resident-agent-callout-close-icon {
      display: block;
    }

    .resident-agent-iframe-container {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: min(500px, calc(100vw - 40px));
      height: 900px;
      max-height: calc(100vh - 120px);
      border: none;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      z-index: 9999;
      display: none;
      overflow: hidden;
    }

    .resident-agent-iframe-container.open {
      display: block;
    }

    @media (max-width: 768px) {
      .resident-agent-trigger {
        bottom: calc(env(safe-area-inset-bottom, 0px) + 0px + 16px);
        right: calc(env(safe-area-inset-right, 0px) + 16px);
      }

      .resident-agent-callout {
        bottom: calc(env(safe-area-inset-bottom, 0px) + 0px + 16px + 80px + 4px);
        right: calc(env(safe-area-inset-right, 0px) + 16px);
        max-width: min(208px, calc(100vw - 32px));
      }

      .resident-agent-iframe-container {
        position: fixed;
