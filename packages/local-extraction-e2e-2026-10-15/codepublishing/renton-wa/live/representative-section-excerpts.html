<h3 class="Cite" id="1-1-1"><a name="1-1-1">1-1-1</a> SEAL:</h3>
<p class="P0">The following be, and is hereby adopted as the Municipal Seal of the City of Renton, State of Washington, to-wit: In the center of said seal the word “SEAL” surrounded by the words “CITY OF RENTON. Incorporated September 6, 1901”. (Ord. 2332, 5-15-67) </p>
